name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test:
    name: Test - ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "pypy-3.11"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15.0-beta.2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install tox
      - name: Run tests
        run: |
          python -m tox -e py
          python -m tox -e noextra
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install tox
      - name: Run linting
        run: python -m tox -e pep8 -e ruff
      - name: Run mypy
        run: python -m tox -e mypy
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install tox
      - name: Test packaging
        run: python -m tox -e packaging
